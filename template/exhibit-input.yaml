# Empty YAML template for an exhibit. Copy to exhibits/<exhibit>.yaml and fill in.
# Schema in design.md, section "Input: YAML per exhibit".

exhibit: <id>      # mod id (no prefix) — the mod's own name: the mod_name column and the card heading
github_id: <id>    # optional expectation of the published id. It is DERIVED (see workflow.md, "Two ids"):
                   # a mod the museum holds from more than one pack is published as <pack>__<mod>
                   # (uni__ExpRC, redux__ExpRC), everything else under its own id; publish_exhibit.py
                   # refuses to run if this line disagrees with the derived id

# internal — input for extract_exhibit.py, NOT shown on the card
# an ORDERED list: a later source's files OVERWRITE an earlier one's with the same relative
# path — the base installer first, the update/overlay archives on top of it
source:
  - kind: exe                       # zip | exe | 7z (exe = a full-game installer; a multi-part one
                                    # needs its .bin slices to stay next to the .exe)
    path: <source>                    # google disk link (downloads it and extracts) OR path to an existing local file (extracts without downloading); relative paths resolve against this file's folder
    target: <mod folder path inside the source>   # e.g. Mods/Solyanka/LEOGraphicsMod
  - kind: zip                       # optional second source, e.g. the pack's update archive
    path: <update or overlay archive>
    target: <the same mod folder path>

# public — acquisition route, rendered in the card README.md
# chain from the start point down to the local file; ref/note/date fields are always
# present but may be left empty; note — English, except verbatim resource names
# (Discord channels, collection/mod-pack titles), which stay in their original spelling
acquire:
  - ref: <url>            # working link for this step
    note: <step description>  # English, except verbatim resource names; values starting with # go in quotes ("#tag")
    date: YYYY-MM-DD      # discord post date / file date (may be left empty)
  - ref: <url>
    note: <step description>
    date: YYYY-MM-DD
